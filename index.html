<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Brand Favicon / Tab Icon -->
    <link rel="icon" type="image/jpeg" href="/logo-with-bg.jpg" />
    <link rel="apple-touch-icon" href="/logo-with-bg.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Conquer Circles — Walk. Claim. Conquer.</title>
    <meta
      name="description"
      content="Turn every walk into territory. Conquer Circles is a fitness walking app that gamifies your movement — claim zones, beat rivals, and own your city."
    />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://conquercircles.app/" />
    <meta property="og:title" content="Conquer Circles — Walk. Claim. Conquer." />
    <meta
      property="og:description"
      content="Turn every walk into territory. Conquer Circles gamifies your movement — claim zones, beat rivals, own your city."
    />
    <meta property="og:image" content="https://conquercircles.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://conquercircles.app/" />
    <meta name="twitter:title" content="Conquer Circles — Walk. Claim. Conquer." />
    <meta
      name="twitter:description"
      content="Turn every walk into territory. Conquer Circles gamifies your movement."
    />
    <meta name="twitter:image" content="https://conquercircles.app/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://conquercircles.app/" />

    <!-- Preconnect to Google Fonts for Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
